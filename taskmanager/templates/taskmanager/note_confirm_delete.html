{% load static %}
{% load pwa %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% progressive_web_app_meta %}

    <title>Delete Note - Hangarin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }

        .message {
            color: #6b7280;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .note-preview {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            color: #374151;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }

        .button-secondary {
            background: #e5e7eb;
            color: #374151;
        }

        .button-secondary:hover {
            background: #d1d5db;
        }

        .button-danger {
            background: #dc2626;
            color: white;
        }

        .button-danger:hover {
            background: #b91c1c;
        }

        @media (max-width: 600px) {
            .card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card">

        <h1>Delete Note?</h1>

        <p class="message">
            Are you sure you want to delete this note?
            This action cannot be undone.
        </p>

        <div class="note-preview">
            {{ note.content }}
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="actions">
                <a href="{% url 'dashboard' %}" class="button button-secondary">
                    Cancel
                </a>

                <button type="submit" class="button button-danger">
                    Delete Note
                </button>
            </div>
        </form>

    </div>
</div>

</body>
</html>
